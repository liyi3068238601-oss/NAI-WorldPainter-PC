name: worldpainter_pc
description: "绘世 Windows 工作台交互原型"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  path: ^1.9.1
  http: ^1.6.0
  web: ^1.1.1
  sqflite_common: ^2.5.13+1
  sqflite_common_ffi: 2.4.3
  sqflite_common_ffi_web: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/prompts/capsules.json
    - licenses/CAPSULES_MIT.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
