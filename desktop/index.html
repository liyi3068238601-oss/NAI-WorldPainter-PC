<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>绘世 · NAI WorldPainter</title>
    <script>
      (() => {
        let cachedTheme = null;
        let systemDark = true;
        try {
          cachedTheme = window.localStorage.getItem("langbai.boot-theme.v1");
        } catch {
          // The application settings remain available from the main process.
        }
        try {
          systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {
          // Keep the product's dark default when system preferences are unavailable.
        }
        const captureTheme = new URLSearchParams(window.location.search).get("uiTheme");
        const dark = captureTheme === "dark"
          || (captureTheme !== "light" && (
            cachedTheme === "light" ? false
              : cachedTheme === "system" ? systemDark
                : true
          ));
        document.documentElement.classList.toggle("theme-dark", dark);
      })();
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #F2F4F8; }
      html.theme-dark, html.theme-dark body, html.theme-dark body #root { background: #0A0A0C; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
